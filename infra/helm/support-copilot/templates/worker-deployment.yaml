apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "support-copilot.componentLabels" (dict "root" . "component" "worker") | indent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: support-copilot
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-copilot
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "support-copilot.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
{{ toYaml .Values.worker.command | indent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}
            - secretRef:
                name: {{ .Values.secretRef.name }}
                optional: {{ .Values.secretRef.optional }}
