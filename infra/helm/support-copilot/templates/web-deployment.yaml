apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "support-copilot.componentLabels" (dict "root" . "component" "web") | indent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: support-copilot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-copilot
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "support-copilot.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
{{ toYaml .Values.web.command | indent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}
            - secretRef:
                name: {{ .Values.secretRef.name }}
                optional: {{ .Values.secretRef.optional }}
          ports:
            - name: {{ .Values.web.port.name }}
              containerPort: {{ .Values.web.port.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.readinessProbe.path }}
              port: {{ .Values.web.port.name }}
            initialDelaySeconds: {{ .Values.web.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.livenessProbe.path }}
              port: {{ .Values.web.port.name }}
            initialDelaySeconds: {{ .Values.web.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.livenessProbe.periodSeconds }}
