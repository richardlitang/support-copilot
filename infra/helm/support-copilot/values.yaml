image:
  repository: support-copilot
  tag: local
  pullPolicy: IfNotPresent

configMap:
  name: support-copilot-config
  data:
    NODE_ENV: production
    APP_URL: http://support-copilot-web:3000
    AI_PROVIDER: mock
    REDIS_URL: redis://redis:6379
    UPLOAD_DIR: /app/uploads
    MAX_UPLOAD_MB: "10"
    DEBUG_MODE: "false"

secretRef:
  name: support-copilot-secrets
  optional: true

web:
  name: support-copilot-web
  replicas: 1
  command:
    - npm
    - run
    - start
  port:
    name: http
    containerPort: 3000
    servicePort: 3000
  readinessProbe:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /api/health
    initialDelaySeconds: 20
    periodSeconds: 20

worker:
  name: support-copilot-worker
  replicas: 1
  command:
    - npm
    - run
    - worker:start

redis:
  enabled: true
  name: redis
  replicas: 1
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port:
    name: redis
    containerPort: 6379
    servicePort: 6379
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
