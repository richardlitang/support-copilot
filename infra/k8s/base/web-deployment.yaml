apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-copilot-web
  namespace: support-copilot
  labels:
    app.kubernetes.io/name: support-copilot
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-copilot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-copilot
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: support-copilot:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start"]
          envFrom:
            - configMapRef:
                name: support-copilot-config
            - secretRef:
                name: support-copilot-secrets
                optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
