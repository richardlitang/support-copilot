apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-copilot-worker
  namespace: support-copilot
  labels:
    app.kubernetes.io/name: support-copilot
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-copilot
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-copilot
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: support-copilot:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "worker:start"]
          envFrom:
            - configMapRef:
                name: support-copilot-config
            - secretRef:
                name: support-copilot-secrets
                optional: true
