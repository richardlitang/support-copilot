apiVersion: v1
kind: ConfigMap
metadata:
  name: support-copilot-config
  namespace: support-copilot
data:
  NODE_ENV: "production"
  APP_URL: "http://support-copilot-web:3000"
  AI_PROVIDER: "openai"
  REDIS_URL: "redis://redis:6379"
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_MB: "10"
  DEBUG_MODE: "false"
